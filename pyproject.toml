[project]
name = "corncam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "atulhacks", email = "atulhacks@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "gradio>=6.30.0",
    "httpx>=0.28",
    "huggingface-hub>=2.3.0",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pyloudnorm>=0.2.0",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sentence-transformers>=6.2.0",
    "silero-vad>=6.2.3",
    "soundfile>=0.14.0",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.1",
    "transformers>=5.21.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
corncam = "corncam:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "gdown>=6.4.2",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
